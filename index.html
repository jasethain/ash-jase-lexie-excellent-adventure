<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Excellent Adventure">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Ash, Jase & Lexie's Excellent Adventure</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#ff8fc7">
<style>
:root{--bg:#fff7fc;--card:#fff;--ink:#332334;--muted:#7d657d;--pink:#ff8fc7;--hot:#ff5fab;--blue:#aee8ff;--mint:#b8f7d4;--yellow:#ffe39d;--lav:#dac7ff;--border:rgba(88,45,92,.15);--shadow:0 18px 50px rgba(120,54,118,.16);--green:#277a4d;--red:#b3261e}
*{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;font-family:ui-rounded,"Comic Neue","SF Pro Rounded","Segoe UI",system-ui,sans-serif;background:radial-gradient(circle at 10% 8%,#ffe0ef,transparent 30%),radial-gradient(circle at 88% 5%,#dff7ff,transparent 32%),radial-gradient(circle at 55% 0,#fff1ba,transparent 26%),var(--bg);color:var(--ink);min-height:100svh;overflow-x:hidden}
.sakura,.sparkle{position:fixed;top:-60px;z-index:0;pointer-events:none;animation:fall linear infinite;opacity:.55}.sakura{font-size:24px}.sparkle{font-size:18px;animation-name:floaty}@keyframes fall{to{transform:translate3d(var(--drift),110svh,0) rotate(520deg)}}@keyframes floaty{0%{transform:translateY(-10svh) scale(.8)}50%{transform:translate(30px,55svh) scale(1.1)}100%{transform:translate(-20px,110svh) scale(.8)}}
header,main{position:relative;z-index:1} header{position:sticky;top:0;z-index:5;backdrop-filter:blur(15px);background:rgba(255,247,252,.88);border-bottom:1px solid var(--border)}.wrap{max-width:1180px;margin:0 auto;padding:14px 16px}.hero{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap}h1{margin:0;font-size:clamp(26px,5vw,50px);letter-spacing:-.045em}.subtitle{color:var(--muted);font-weight:900}.kitty{display:inline-block;transform:rotate(-8deg);filter:drop-shadow(0 6px 0 #fff)}.pill{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border);background:#fff;border-radius:999px;padding:10px 14px;font-weight:1000;box-shadow:var(--shadow)}
.nav{display:flex;gap:8px;overflow:auto;padding:10px 16px 14px}.nav button,.btn{border:0;border-radius:999px;padding:11px 14px;font-weight:1000;background:var(--card);color:var(--ink);box-shadow:0 8px 22px rgba(0,0,0,.08);cursor:pointer;white-space:nowrap}.nav button.active,.btn.primary{background:linear-gradient(135deg,var(--hot),var(--pink));color:#fff}.btn.green{background:var(--green);color:#fff}.btn.dark{background:#2b2630;color:#fff}.btn.small{padding:7px 10px;font-size:13px}.danger{color:var(--red);font-weight:1000}
main{max-width:1180px;margin:0 auto;padding:18px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px}.card{grid-column:span 12;background:rgba(255,255,255,.95);border:1px solid var(--border);border-radius:30px;padding:18px;box-shadow:var(--shadow)}@media(min-width:820px){.span4{grid-column:span 4}.span5{grid-column:span 5}.span6{grid-column:span 6}.span7{grid-column:span 7}.span8{grid-column:span 8}.span3{grid-column:span 3}.span9{grid-column:span 9}}
h2{margin:0 0 12px;font-size:26px}.event{display:grid;grid-template-columns:82px 1fr;gap:14px;padding:14px;border:1px solid var(--border);border-radius:24px;background:linear-gradient(135deg,#fff,#fff7fb);margin-bottom:12px}.datebox{text-align:center;border-radius:20px;background:#fff0f8;padding:10px;font-weight:1000;border:1px solid #ffd1e9}.datebox .day{font-size:24px}.tag{display:inline-block;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:1000;background:#e8f8ff;margin-right:6px}.tag.v{background:#e9fff1;color:#14623a}.tag.lexie{background:#fff4d6;color:#735000}.muted{color:var(--muted)}details{margin-top:8px}summary{font-weight:1000;cursor:pointer}.check{display:flex;gap:10px;align-items:flex-start;padding:12px;border-bottom:1px dashed var(--border)}input[type=checkbox]{width:22px;height:22px;accent-color:var(--pink)}
.ref{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--border);padding:10px 0}.ref b{min-width:42%}.countdown{font-size:38px;font-weight:1000;letter-spacing:-.05em}.mini{font-size:13px;color:var(--muted)}textarea,input,select{width:100%;border:1px solid var(--border);border-radius:18px;padding:13px;font:inherit;background:#fff}textarea{min-height:120px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.hidden{display:none!important}a{color:#b5179e;font-weight:900}.bubble{padding:12px;border-radius:20px;background:#fff4d6;margin:8px 0}.veg{background:#ecfff4;border:1px solid #b8f7d4}.phone{background:#eef8ff;border:1px solid #bcecff}.lexie{background:#fff8df;border:1px solid #ffe39d}.rainbow{height:10px;border-radius:999px;background:linear-gradient(90deg,var(--hot),var(--yellow),var(--mint),var(--blue),var(--lav));margin-top:12px}.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#2b2630;color:#fff;padding:12px 16px;border-radius:999px;font-weight:900;box-shadow:var(--shadow);display:none;z-index:99}.list{margin:8px 0 0 0;padding-left:20px}.stamp{display:inline-flex;align-items:center;justify-content:center;width:70px;height:70px;border-radius:24px;background:#fff0f8;border:2px dashed #ffb3d8;font-size:32px;margin:6px}.journal-card{border:1px solid var(--border);border-radius:24px;padding:12px;margin:10px 0;background:linear-gradient(135deg,#fff,#fffaf2)}.photo-preview{max-width:100%;border-radius:20px;border:1px solid var(--border);margin-top:10px}.source{font-size:12px;color:var(--muted)}
@media print{header,.actions,.nav,.btn{display:none}.card{box-shadow:none;break-inside:avoid}body{background:#fff}.sakura,.sparkle{display:none}}
</style>
</head><body>
<header><div class="wrap hero"><div><h1><span class="kitty">🎀</span> Ash, Jase & Lexie's Excellent Adventure</h1><div class="subtitle">Hello Kitty inspired · offline-first · Apple Maps · translator · currency · Lexie journal</div></div><div class="pill" id="nextPill">Loading trip clock…</div></div><nav class="nav" id="nav"></nav></header>
<main id="app"></main><div class="toast" id="toast"></div>
<script src="trip-data.js"></script>
<script>
const trip=window.TRIP_DATA, app=document.getElementById('app');
const tabs=["Dashboard","Itinerary","Lexie Journal","Translator","Currency","Apple Maps","Phone Use","Food","Reminders","Tickets","Checklist","Add Info","Files"];
let active=localStorage.getItem('tripTab')||'Dashboard';
const $=id=>document.getElementById(id); const fmt=d=>new Date(d+'T00:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'}); const dateParts=d=>{const x=new Date(d+'T00:00:00');return{mon:x.toLocaleString(undefined,{month:'short'}),day:x.getDate()}};
function toast(t){const el=$('toast');el.textContent=t;el.style.display='block';setTimeout(()=>el.style.display='none',2500)}
function icon(t){return {Dashboard:'🏠',Itinerary:'🗓️','Lexie Journal':'📖',Translator:'🎤',Currency:'💴','Apple Maps':'🗺️','Phone Use':'📱',Food:'🍟',Reminders:'🔔',Tickets:'🎟️',Checklist:'✅','Add Info':'➕',Files:'📁'}[t]||'🎀'}
function nav(){ $('nav').innerHTML=tabs.map(t=>`<button class="${t===active?'active':''}" onclick="active='${t}';localStorage.setItem('tripTab',active);render();nav()">${icon(t)} ${t}</button>`).join('') }
function list(a){return `<ul class="list">${(a||[]).map(x=>`<li>${x}</li>`).join('')}</ul>`}
function appleLink(q){return `maps://?q=${encodeURIComponent(q)}`}
function eventCard(e){const p=dateParts(e.date); return `<div class="event"><div class="datebox"><div>${p.mon}</div><div class="day">${p.day}</div><div>${e.start}</div></div><div><span class="tag">${e.type}</span><span class="tag v">🌱 Jase/Ash</span><span class="tag lexie">🍟 Lexie</span><b>${e.title}</b><div class="muted">${fmt(e.date)} · ${e.start}${e.end?` to ${e.end}`:''}</div><div>${e.location}</div><div class="actions"><a class="btn small" href="${appleLink(e.appleQuery||e.location)}">Open in Apple Maps</a><button class="btn small" onclick="quickJournal('${e.id}')">Lexie journal</button></div><details><summary>Details, travel, food & suggestions</summary><p>${e.details}</p><p><b>🚆 Travel:</b> ${e.travel}</p><p><b>🌱 Jase/Ash food:</b> ${e.foodJaseAsh}</p><p><b>🍟 Lexie food:</b> ${e.foodLexie}</p><p><b>✨ Things to do:</b></p>${list(e.suggestions)}<p><b>🔔 Reminders:</b></p>${list(e.reminders)}</details></div></div>`}
function dashboard(){const next=trip.events.find(e=>new Date((e.endDate||e.date)+'T23:59:00')>=new Date())||trip.events[0]; return `<div class="grid"><section class="card span8"><h2>Next up</h2>${eventCard(next)}<div class="actions"><button class="btn primary" onclick="downloadICS()">Download calendar reminders</button><button class="btn" onclick="window.print()">Print trip sheet</button></div></section><section class="card span4"><h2>Trip countdown</h2><div class="countdown" id="countBig"></div><div class="mini">until QF79 leaves Melbourne</div><div class="rainbow"></div></section><section class="card span6"><h2>🎀 Offline-first travel brain</h2><div class="bubble">Works as a saved iPhone/iPad web app after you open it once. Notes, journals and uploaded images save on the device.</div><div class="bubble phone">Maps open in Apple Maps. Download offline areas in Apple Maps before departure.</div><div class="bubble veg">Vegetarian mode for Jase/Ash. Separate plain-food mode for Lexie.</div></section><section class="card span6"><h2>Best spare-time picks</h2>${trip.freeTimeSuggestions.map(x=>`<div class="ref"><b>${x.day}</b><span>${x.best}<br><span class="mini">${x.why}</span></span></div>`).join('')}</section></div>`}
function itinerary(){return `<section class="card"><h2>Itinerary</h2>${trip.events.map(eventCard).join('')}</section>`}
function lexieJournal(){const entries=JSON.parse(localStorage.lexieJournal||'[]');return `<div class="grid"><section class="card span7"><h2>🎀 Lexie's Location-Aware Adventure Journal</h2><p class="muted">Tap a location or use “near me”. The app creates easy prompts, stamps, food help and photo/voice-note spaces.</p><div class="actions"><button class="btn primary" onclick="detectPlace()">Use my location</button>${trip.lexieMissions.map(m=>`<button class="btn" onclick="newLexieEntry('${m.place}')">${m.icon} ${m.place}</button>`).join('')}</div><div id="journalForm"></div><h2>Saved journal pages</h2><div id="journalEntries">${entries.length?entries.map(renderJournalEntry).join(''):'<div class="bubble">No journal pages yet. Start with a Disney, Sanrio, Fuji or “near me” page.</div>'}</div></section><section class="card span5"><h2>🍟 Lexie Food Mode</h2><div class="bubble lexie"><b>Lexie is not vegetarian.</b><br>She prefers very basic food: chicken nuggets, hot chips, chicken noodles, plain pasta, simple pizza, garlic bread, ice cream, pancakes and desserts. Avoid sauces, spicy food, seafood and mixed dishes.</div><h2>Treasure Hunt</h2>${trip.lexieMissions.map(m=>`<div class="ref"><b>${m.icon} ${m.place}</b><span>${m.mission}<br><span class="mini">${m.food}</span></span></div>`).join('')}</section></div>`}
function renderJournalEntry(e,i){return `<div class="journal-card"><b>${e.icon||'🎀'} ${e.place}</b><div class="mini">${e.date} · ${e.mood||'no mood'} · ${e.rating||'no'} stars</div><p>${e.text||''}</p>${e.photo?`<img class="photo-preview" src="${e.photo}">`:''}<div class="actions"><button class="btn small" onclick="deleteJournal(${i})">Delete</button></div></div>`}
function newLexieEntry(place){const m=trip.lexieMissions.find(x=>x.place===place)||trip.lexieMissions[0]; $('journalForm').innerHTML=`<div class="journal-card"><h2>${m.icon} ${m.place} journal page</h2><div class="bubble lexie"><b>Mission:</b> ${m.mission}<br><b>Prompt:</b> ${m.prompt}<br><b>Food helper:</b> ${m.food}</div><label>How did it feel?</label><select id="jMood"><option>😍 Loved it</option><option>😊 Happy</option><option>😮 Amazed</option><option>😴 Tired</option><option>😐 Not sure</option></select><label>Stars</label><select id="jRating"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select><label>Lexie's words or voice-note summary</label><textarea id="jText" placeholder="Today I liked..."></textarea><label>Add photo</label><input id="jPhoto" type="file" accept="image/*" capture="environment"><div class="actions"><button class="btn primary" onclick="saveLexieEntry('${m.place}','${m.icon}')">Save page</button><button class="btn" onclick="speakText('${m.prompt.replaceAll("'","\\'")}')">Read prompt aloud</button></div></div>`;}
function quickJournal(id){const e=trip.events.find(x=>x.id===id); active='Lexie Journal'; localStorage.tripTab=active; render(); nav(); setTimeout(()=>newLexieEntry(e.title.includes('Disney')?'Disney':e.title.includes('Sanrio')?'Sanrio Puroland':e.title.includes('Fuji')?'Mount Fuji':e.title.includes('Sumo')?'Asakusa':'Tokyo trains'),50)}
function saveLexieEntry(place,icon){const file=$('jPhoto').files[0]; const finish=photo=>{const arr=JSON.parse(localStorage.lexieJournal||'[]'); arr.unshift({place,icon,date:new Date().toLocaleString(),mood:$('jMood').value,rating:$('jRating').value,text:$('jText').value,photo}); localStorage.lexieJournal=JSON.stringify(arr); toast('Lexie journal saved 🎀'); render()}; if(file){const r=new FileReader();r.onload=()=>finish(r.result);r.readAsDataURL(file)}else finish('')}
function deleteJournal(i){const arr=JSON.parse(localStorage.lexieJournal||'[]');arr.splice(i,1);localStorage.lexieJournal=JSON.stringify(arr);render()}
function detectPlace(){if(!navigator.geolocation){toast('Location not available');return} navigator.geolocation.getCurrentPosition(pos=>{toast('Location checked. Pick the closest place below.');},()=>toast('Location permission denied. Choose the place manually.'))}
function translator(){const cats=[...new Set(trip.translator.phrases.map(p=>p.cat))];return `<div class="grid"><section class="card span7"><h2>🎤 Built-in phrase translator</h2><p class="muted">Offline-friendly phrase cards for the situations you’ll actually hit. Tap speak to play Japanese aloud.</p>${cats.map(c=>`<h2>${c}</h2>${trip.translator.phrases.filter(p=>p.cat===c).map(p=>`<div class="bubble"><b>${p.en}</b><br><span style="font-size:24px">${p.ja}</span><br><span class="mini">${p.romaji}</span><div class="actions"><button class="btn small primary" onclick="speakText('${p.ja}')">Speak Japanese</button><button class="btn small" onclick="copyText('${p.ja}')">Copy</button></div></div>`).join('')}`).join('')}</section><section class="card span5"><h2>📷 Visual translator</h2><div class="bubble">For true camera translation, use Apple Translate/Camera with Japanese downloaded before travel. This app keeps your photos and lets you attach the translation result manually for offline reference.</div><input type="file" id="visualPhoto" accept="image/*" capture="environment"><textarea id="visualText" placeholder="Type or paste the translated text here..."></textarea><button class="btn primary" onclick="saveVisualTranslation()">Save visual translation</button><div id="visualSaved">${renderVisuals()}</div></section></div>`}
function renderVisuals(){const a=JSON.parse(localStorage.visualTranslations||'[]');return a.map((v,i)=>`<div class="journal-card"><b>Visual translation</b><div class="mini">${v.date}</div><p>${v.text}</p>${v.photo?`<img class="photo-preview" src="${v.photo}">`:''}<button class="btn small" onclick="deleteVisual(${i})">Delete</button></div>`).join('')}
function saveVisualTranslation(){const f=$('visualPhoto').files[0]; const finish=photo=>{const a=JSON.parse(localStorage.visualTranslations||'[]');a.unshift({date:new Date().toLocaleString(),text:$('visualText').value,photo});localStorage.visualTranslations=JSON.stringify(a);toast('Visual translation saved');render()}; if(f){const r=new FileReader();r.onload=()=>finish(r.result);r.readAsDataURL(f)}else finish('')}
function deleteVisual(i){const a=JSON.parse(localStorage.visualTranslations||'[]');a.splice(i,1);localStorage.visualTranslations=JSON.stringify(a);render()}
function speakText(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=/[ぁ-んァ-ン一-龯]/.test(t)?'ja-JP':'en-AU';speechSynthesis.speak(u)}catch(e){toast('Speech not available on this device')}}
function copyText(t){navigator.clipboard?.writeText(t);toast('Copied')}
function currency(){const rate=trip.meta.audJpyRate;return `<div class="grid"><section class="card span6"><h2>💴 Offline AUD ⇄ JPY converter</h2><div class="bubble">Using last known rate: <b>1 AUD = ¥${rate}</b><br><span class="mini">As of ${trip.meta.audJpyAsOf}. Offline estimates only.</span></div><label>AUD $</label><input id="aud" type="number" value="10" oninput="conv('aud')"><label>Japanese yen ¥</label><input id="jpy" type="number" value="${(10*rate).toFixed(0)}" oninput="conv('jpy')"><div class="actions"><button class="btn" onclick="setAud(10)">$10</button><button class="btn" onclick="setAud(50)">$50</button><button class="btn" onclick="setAud(100)">$100</button></div></section><section class="card span6"><h2>Quick cheat sheet</h2>${[5,10,20,50,100,200].map(n=>`<div class="ref"><b>$${n} AUD</b><span>≈ ¥${(n*rate).toFixed(0)}</span></div>`).join('')}</section></div>`}
function conv(which){const rate=trip.meta.audJpyRate;if(which==='aud')$('jpy').value=(Number($('aud').value||0)*rate).toFixed(0);else $('aud').value=(Number($('jpy').value||0)/rate).toFixed(2)} function setAud(n){$('aud').value=n;conv('aud')}
function appleMaps(){return `<div class="grid"><section class="card span7"><h2>🗺️ Apple Maps Hub</h2><p>Tap any destination to open Apple Maps. Before departure, download offline areas inside Apple Maps: Tokyo central, Narita, Maihama/Disney, Tama Center/Puroland and Fuji/Kawaguchiko.</p>${trip.mapPlaces.map(p=>`<div class="ref"><b>${p.name}</b><span>${p.area}<br><a class="btn small" href="${appleLink(p.query)}">Open in Apple Maps</a></span></div>`).join('')}</section><section class="card span5"><h2>Offline setup on iPhone/iPad</h2><ol class="list"><li>Open Apple Maps.</li><li>Tap your photo/initials beside the search field.</li><li>Tap <b>Offline Maps</b>.</li><li>Download each area: Tokyo, Narita, Maihama, Tama Center, Fuji/Kawaguchiko.</li><li>Turn on automatic updates before the trip.</li><li>Save hotel and bookings as favourites.</li></ol><div class="bubble phone">This app cannot legally bundle Apple/Google map tiles. It links to Apple Maps and stores offline route notes instead.</div></section></div>`}
function phoneUse(){return `<div class="grid"><section class="card span6"><h2>📱 iPhone/iPad access</h2><ol class="list"><li>Open this app link in Safari on each iPhone/iPad.</li><li>Tap Share.</li><li>Tap <b>Add to Home Screen</b>.</li><li>Name it <b>Excellent Adventure</b>.</li><li>Open it once before travel so the offline cache is installed.</li><li>Keep Safari website data intact during the trip.</li></ol></section><section class="card span6"><h2>ALDI Prepaid SIM notes</h2><div class="bubble phone">For Ashleigh and Jase: enable international roaming in My ALDI Mobile before departure, buy/confirm a roaming pack for Japan, and keep PAYG credit as backup.</div><div class="bubble phone danger">The ALDI app may not be accessible overseas, so set this up before flying.</div><h2>Apple translator setup</h2><ol class="list"><li>Open Apple Translate.</li><li>Download Japanese for offline use.</li><li>Test voice conversation mode.</li><li>Use Camera/Photos translation for signs and menus.</li></ol></section></div>`}
function food(){return `<div class="grid"><section class="card span6"><h2>🌱 Jase & Ash Vegetarian Mode</h2><div class="bubble veg"><b>Japanese card:</b><br>私はベジタリアンです。肉と魚は入れないでください。魚のだしや肉のだしも入っていますか？</div>${list(trip.vegetarianPlaces)}</section><section class="card span6"><h2>🍟 Lexie Plain Food Mode</h2><div class="bubble lexie"><b>Lexie likes:</b> ${trip.meta.people.Lexie.likes.join(', ')}.</div><div class="bubble lexie"><b>Avoid:</b> ${trip.meta.people.Lexie.avoids.join(', ')}.</div><div class="bubble"><b>Japanese card:</b><br>ソースなしで、シンプルな料理だけお願いします。チキンナゲット、フライドポテト、プレーンな麺、またはプレーンなパスタはありますか？</div></section></div>`}
function reminders(){return `<section class="card"><h2>Smart reminders</h2>${trip.events.map(e=>`<div class="bubble"><b>${fmt(e.date)} · ${e.title}</b>${list(e.reminders)}</div>`).join('')}</section>`}
function tickets(){return `<section class="card"><h2>Tickets & Booking Wallet</h2>${trip.events.map(e=>`<div class="ref"><b>${e.title}</b><span>${e.details}</span></div>`).join('')}<div class="actions"><a class="btn" href="Qantas_E_Ticket_DQ3AT8.pdf">Open Qantas e-ticket PDF</a><a class="btn" href="Tokyo_Meeting_Point.jpg">Open Fuji meeting point image</a></div></section>`}
function checklist(){const checked=JSON.parse(localStorage.tripChecks||'{}');return `<section class="card"><h2>Checklist</h2>${trip.checklist.map((c,i)=>`<label class="check"><input type="checkbox" ${checked[i]?'checked':''} onchange="saveCheck(${i},this.checked)"><span>${c}</span></label>`).join('')}</section>`}function saveCheck(i,v){const c=JSON.parse(localStorage.tripChecks||'{}');c[i]=v;localStorage.tripChecks=JSON.stringify(c)}
function addInfo(){const notes=localStorage.tripNotes||'';const custom=JSON.parse(localStorage.customItems||'[]');return `<div class="grid"><section class="card span6"><h2>➕ Add new information</h2><label>Title</label><input id="ciTitle" placeholder="New booking, restaurant, note..."><label>Details</label><textarea id="ciDetails"></textarea><label>Attach photo/file image</label><input id="ciFile" type="file" accept="image/*,application/pdf"><button class="btn primary" onclick="saveCustom()">Save new info</button><h2>Saved items</h2>${custom.map((x,i)=>`<div class="journal-card"><b>${x.title}</b><p>${x.details}</p>${x.file?`<a href="${x.file}" download="${x.fileName}">Open attachment</a>`:''}<div><button class="btn small" onclick="deleteCustom(${i})">Delete</button></div></div>`).join('')}</section><section class="card span6"><h2>Shared trip notes on this device</h2><textarea id="notes">${notes}</textarea><button class="btn" onclick="localStorage.tripNotes=$('notes').value;toast('Notes saved')">Save notes</button></section></div>`}
function saveCustom(){const f=$('ciFile').files[0];const finish=(file,fileName)=>{const a=JSON.parse(localStorage.customItems||'[]');a.unshift({title:$('ciTitle').value,details:$('ciDetails').value,file,fileName});localStorage.customItems=JSON.stringify(a);toast('New info saved');render()}; if(f){const r=new FileReader();r.onload=()=>finish(r.result,f.name);r.readAsDataURL(f)}else finish('','')}
function deleteCustom(i){const a=JSON.parse(localStorage.customItems||'[]');a.splice(i,1);localStorage.customItems=JSON.stringify(a);render()}
function files(){return `<section class="card"><h2>Files</h2><div class="actions"><a class="btn primary" href="Qantas_E_Ticket_DQ3AT8.pdf">Qantas e-ticket PDF</a><a class="btn" href="Tokyo_Meeting_Point.jpg">Fuji meeting point image</a></div><div class="bubble">Uploaded user content is saved locally on the device in browser storage. For family sharing, each person should add the app to their Home Screen and add their own journal/photos, or you can deploy the app to Vercel/Netlify and share the link.</div></section>`}
function downloadICS(){let ics='BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//Excellent Adventure//Trip//EN\n';trip.events.forEach(e=>{const dt=e.date.replaceAll('-','')+'T'+e.start.replace(':','')+'00'; const de=(e.endDate||e.date).replaceAll('-','')+'T'+(e.end||e.start).replace(':','')+'00';ics+=`BEGIN:VEVENT\nUID:${e.id}@excellent-adventure\nDTSTART:${dt}\nDTEND:${de}\nSUMMARY:${e.title}\nLOCATION:${e.location}\nDESCRIPTION:${(e.details+' '+e.travel).replace(/\n/g,' ')}\nEND:VEVENT\n`});ics+='END:VCALENDAR';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([ics],{type:'text/calendar'}));a.download='excellent-adventure-calendar.ics';a.click()}
function render(){app.innerHTML=({Dashboard:dashboard,Itinerary:itinerary,'Lexie Journal':lexieJournal,Translator:translator,Currency:currency,'Apple Maps':appleMaps,'Phone Use':phoneUse,Food:food,Reminders:reminders,Tickets:tickets,Checklist:checklist,'Add Info':addInfo,Files:files}[active]||dashboard)(); updateCountdown()}
function updateCountdown(){const target=new Date(trip.meta.tripStart), now=new Date(), diff=target-now; const days=Math.max(0,Math.ceil(diff/86400000)); $('nextPill').textContent=days?`✈️ ${days} days to Japan`:'🇯🇵 Adventure mode'; const big=$('countBig'); if(big) big.textContent=days+' days'}
function confetti(){['🌸','🎀','✨','🐱','🌸','✨','🎀'].forEach((c,i)=>{const el=document.createElement('div');el.className=i%2?'sparkle':'sakura';el.textContent=c;el.style.left=Math.random()*100+'vw';el.style.animationDuration=(9+Math.random()*10)+'s';el.style.animationDelay=(-Math.random()*12)+'s';el.style.setProperty('--drift',(Math.random()*160-80)+'px');document.body.appendChild(el)})}
if('serviceWorker' in navigator){navigator.serviceWorker.register('service-worker.js').catch(()=>{})} confetti(); nav(); render(); setInterval(updateCountdown,60000);
</script></body></html>
